<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Article | DevLog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        ✍️ Dev<span>Log</span>
      </a>
      <button class="nav-mobile-toggle" id="mobileToggle" aria-label="Toggle Navigation">☰</button>
      <ul class="nav-links" id="navLinks"></ul>
    </div>
  </header>

  <!-- Edit Blog Form Section -->
  <main>
    <div class="container" style="max-width: 800px;">
      <div style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main);">Edit Blog Article</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Update and save changes directly to the database.</p>
        </div>
        <a href="dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
      </div>

      <div id="alertBox" class="alert"></div>

      <div id="loadingBox" style="text-align: center; padding: 3rem; background: #fff; border-radius: 12px; border: 1px solid var(--border-color);">
        <p style="color: var(--text-muted);">Fetching article details from database...</p>
      </div>

      <div id="editFormWrapper" style="display: none; background: #ffffff; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
        <form id="editBlogForm">
          <div class="form-group">
            <label for="editTitle">Article Title *</label>
            <input 
              type="text" 
              id="editTitle" 
              class="form-control" 
              required 
            />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
              <label for="editCategory">Category / Tag *</label>
              <select id="editCategory" class="form-control" required>
                <option value="">Select a category</option>
                <option value="Development">Development</option>
                <option value="Design">Design</option>
                <option value="JavaScript">JavaScript</option>
                <option value="AI & ML">AI & ML</option>
                <option value="DevOps">DevOps</option>
                <option value="General">General</option>
              </select>
            </div>

            <div class="form-group">
              <label for="editImageUrl">Cover Image URL</label>
              <input 
                type="url" 
                id="editImageUrl" 
                class="form-control" 
                placeholder="https://images.unsplash.com/..." 
              />
            </div>
          </div>

          <div class="form-group">
            <label for="editExcerpt">Short Excerpt / Summary *</label>
            <input 
              type="text" 
              id="editExcerpt" 
              class="form-control" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="editContent">Article Content (Full Body) *</label>
            <textarea 
              id="editContent" 
              class="form-control" 
              rows="9" 
              required
            ></textarea>
          </div>

          <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes (Update)</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 DevLog Application. Built with HTML, CSS, JavaScript, Express & Database.</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get("id");

    async function loadPostForEdit() {
      if (!postId) {
        showAlert("No post ID specified to edit.");
        document.getElementById("loadingBox").style.display = "none";
        return;
      }

      try {
        const response = await fetch(`/api/blogs/${encodeURIComponent(postId)}`);
        const data = await response.json();

        if (!response.ok || !data.success || !data.blog) {
          showAlert("Could not find article in database.");
          document.getElementById("loadingBox").style.display = "none";
          return;
        }

        const post = data.blog;
        document.getElementById("editTitle").value = post.title || "";
        document.getElementById("editCategory").value = post.category || "General";
        document.getElementById("editImageUrl").value = post.image || "";
        document.getElementById("editExcerpt").value = post.excerpt || "";
        document.getElementById("editContent").value = post.content || "";

        document.getElementById("loadingBox").style.display = "none";
        document.getElementById("editFormWrapper").style.display = "block";
      } catch (err) {
        console.error("Error fetching post for edit:", err);
        showAlert("Failed to load article from database.");
        document.getElementById("loadingBox").style.display = "none";
      }
    }

    document.getElementById("editBlogForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("editTitle").value.trim();
      const category = document.getElementById("editCategory").value;
      const image = document.getElementById("editImageUrl").value.trim();
      const excerpt = document.getElementById("editExcerpt").value.trim();
      const content = document.getElementById("editContent").value.trim();

      if (!title || !category || !excerpt || !content) {
        showAlert("Please fill in all required fields.");
        return;
      }

      try {
        const response = await fetch(`/api/blogs/${encodeURIComponent(postId)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, category, image, excerpt, content })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showAlert(data.message || "Failed to update article.");
          return;
        }

        showAlert("Article updated successfully! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = `blog-detail.html?id=${encodeURIComponent(postId)}`;
        }, 1200);
      } catch (err) {
        console.error("Error updating article:", err);
        showAlert("Network error updating article.");
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      loadPostForEdit();
    });
  </script>
</body>
</html>
